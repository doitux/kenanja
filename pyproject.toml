[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenanja"
version = "0.2.0"
description = "Aus einem MP3 Chord-Sheet, Leadsheet, Streicherstimmen, Chor-Textblatt und Übe-Audio für die Lobpreisband erzeugen"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "doitux"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "scipy", "librosa>=0.10", "soundfile", "onnxruntime>=1.16", "music21>=9",
  "pyphen", "fastapi", "uvicorn", "python-multipart", "pillow", "sherpa-onnx>=1.12",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
rubberband = ["pylibrb"]
fenster = ["PySide6>=6.6"]

[project.scripts]
kenanja = "kenanja.cli:main"

[tool.setuptools.packages.find]
include = ["kenanja*"]

[tool.setuptools.package-data]
kenanja = ["data/*", "web/static/*", "audio/modelle/*"]
